{% set name = "amqp" %}
{% set version = "5.4.0" %}

package:
    name: {{ name }}
    version: {{ version }}

source:
    - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
      sha256: aaa33987dcb6a7893955d3b4f537c5d4755addce1009929e63e5d18c1b51a0a7
    - url: https://github.com/celery/py-{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
      sha256: e3a5af985c8b3a115a7fd416d1c7f81236fbf2d11b22cd74089f15e383fdbacd
      folder: gh_src

build:
    # This library has experimental support of speedups. To enable speedups, CELERY_ENABLE_SPEEDUPS 
    # environment variable must be set during building/installation. Enable it when it will be stable.
    # script_env:
    #     - CELERY_ENABLE_SPEEDUPS=true
    number: 0
    skip: true  # [py<310]
    script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
    build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
    host:
        - python
        # For experimental support of speedups
        #- cython
        - pip
        - setuptools >=20.6.7
        - wheel >=0.29.0
    run:
        - python
        - vine >=5.0.0,<6.0.0

{% set tests_to_skip = " test_read_frame__windowstimeout " %}
{% set tests_to_skip = tests_to_skip + " or test_heartbeat_check_rate_default" %} # [win and osx]
{% set tests_to_skip = tests_to_skip + " or test_heartbeat_check_rate_four" %} # [win]
{% set tests_to_skip = tests_to_skip + " or test_heartbeat_check_rate_wrong" %} # [win]

test:
    source_files:
        - gh_src
    requires:
        - pip
        - pytest >=6.2.5,<=8.0.0
        - pytest-sugar >=0.9.1
        - pytest-rerunfailures >=6.0
    imports:
        - amqp.abstract_channel
        - amqp.basic_message
        - amqp.channel
        - amqp.connection
        - amqp.platform
        - amqp.protocol
        - amqp.transport
        - amqp.serialization
    commands:
        - pip check
        - pytest -xv gh_src/t/unit -k "not ({{ tests_to_skip }})"
        - pytest -xv gh_src/t/integration

about:
    home: https://github.com/celery/py-amqp
    license: BSD-3-Clause
    license_family: BSD
    license_file: LICENSE
    summary: Low-level AMQP client for Python (fork of amqplib)
    description: |
        It is maintained by the Celery project, and used by kombu as a pure python alternative when librabbitmq is not available.
        This library should be API compatible with librabbitmq.
    doc_url: https://amqp.readthedocs.io
    dev_url: https://github.com/celery/py-amqp

extra:
    recipe-maintainers:
        - anguslees
        - kwilcox
        - wseaton
        - frol
